apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-order
  labels:
    app: mongo-order
spec:
  serviceName: mongo-order
  replicas: 1
  selector:
    matchLabels:
      app: mongo-order
  template:
    metadata:
      labels:
        app: mongo-order
    spec:
      containers:
        - name: mongo-order
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-order-credentials
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-order-credentials
                  key: password
          volumeMounts:
            - name: mongo-order-data
              mountPath: /data/db
            - name: mongo-init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
      volumes:
        - name: mongo-init-scripts
          configMap:
            name: mongo-order-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: mongo-order-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi