apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-order
  labels:
    app: redis-order
spec:
  template:
    metadata:
      labels:
        app: redis-order
    spec:
      containers:
        - name: redis
          image: redis:8.4.0
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-order-credentials
                  key: password
            - name: REDIS_ARGS
              value: "--requirepass $REDIS_PASSWORD"
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
  selector:
    matchLabels:
      app: redis-order
  replicas: 1
